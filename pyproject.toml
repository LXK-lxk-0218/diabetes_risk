# ========== 项目基础信息块  ==========
[project]
# 整个工作区项目名字，只是标识，不是对外发布的包名
name = "diabetes-risk"
# 项目版本号
version = "0.1.0"
# 项目描述，写清楚用途：糖尿病风险筛查 MLOps 教学项目， uv 工作区根目录
description = "社区糖尿病风险筛查：MLOps 教学项目（uv 工作区根）"
# 约束Python 最低版本
requires-python = ">=3.12"
# 依赖列表：这个工作区依赖我们自己写的三个子包
dependencies = ["drisk-core", "drisk-training", "drisk-api"]

# ========== 依赖分组：开发工具组  ==========
[dependency-groups]
# dev分组：只给开发、测试、代码检查用，上线部署的时候不需要这一组
dev = [
    "ruff>=0.6",          # 代码格式化 + 代码规范检查工具
    "mypy>=1.11",         # Python 静态类型检查工具
    "pytest>=8.0",        # 单元测试框架
    "pytest-cov>=5.0",    # pytest 配套，统计代码测试覆盖率
    "import-linter>=2.1", # 导入契约检查，专门管控包之间能不能互相 import（我们分层的核心）
    "pandas>=2.0",        # 数据分析（用于数据指纹验证）
    "pyarrow>=14.0",      # Parquet 读写后端
]

# ========== uv 自身配置  ==========
[tool.uv]
package = false            # 【非常重要】根目录不打包！它只是工作区管理，不是可发布包
default-groups = ["dev"]   # 执行 uv sync 的时候，默认自动安装 dev 组里所有开发工具

# ========== uv 工作区：声明成员子包  ==========
[tool.uv.workspace]
# 告诉 uv ：这三个文件夹是我们工作区里的子包成员
members = ["packages/core", "packages/training", "services/api"]

# ========== 子包来源声明：包是本地工作区内的，不是从网上下载  ==========
[tool.uv.sources]
# drisk-core 这个包，来自本地工作区，不要去 pypi 下载
drisk-core = { workspace = true }
# drisk-training 来自本地工作区
drisk-training = { workspace = true }
# drisk-api 来自本地工作区
drisk-api = { workspace = true }

# ========== 配置 pip 源：默认 PyPI（清华镜像 403 时切回）  ==========
# [[tool.uv.index]]
# name = "tuna"
# url = "https://pypi.tuna.tsinghua.edu.cn/simple"
# default = true  # 设置为默认源

# ---------------- 下面是代码质量工具统一配置  ----------------
# ========== ruff 代码规范、格式化配置  ==========
[tool.ruff]
line-length = 120               # 一行代码最长允许 120 字符，比默认宽松一点
target-version = "py313"        # 适配python3.13 语法规则
extend-exclude = ["data", "runs", "baselines"] # 这些文件夹跳过 ruff 检查

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"] # 开启的检查规则集
ignore = ["E501"]   # 忽略E501 行过长报错；行宽交给 ruff format 自动排版

[tool.ruff.lint.isort]
known-first-party = ["diabetes_risk", "drisk_training", "drisk_api"]

# ========== mypy 静态类型检查配置  ==========
[tool.mypy]
python_version = "3.13"
files = ["packages/core/src", "packages/training/src", "services/api/src", "scripts"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

# ========== pytest 单元测试配置  ==========
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--import-mode=importlib"]

# ========== coverage 覆盖率配置  ==========
[tool.coverage.run]
branch = true
source = ["diabetes_risk", "drisk_training", "drisk_api"]
[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true